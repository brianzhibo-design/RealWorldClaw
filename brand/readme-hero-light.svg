<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)" rx="12"/>
  <!-- Subtle grid dots -->
  <g fill="#cbd5e1" opacity="0.4">
    <circle cx="60" cy="60" r="1.5"/><circle cx="120" cy="60" r="1.5"/><circle cx="180" cy="60" r="1.5"/><circle cx="240" cy="60" r="1.5"/><circle cx="300" cy="60" r="1.5"/>
    <circle cx="900" cy="60" r="1.5"/><circle cx="960" cy="60" r="1.5"/><circle cx="1020" cy="60" r="1.5"/><circle cx="1080" cy="60" r="1.5"/><circle cx="1140" cy="60" r="1.5"/>
    <circle cx="60" cy="340" r="1.5"/><circle cx="120" cy="340" r="1.5"/><circle cx="180" cy="340" r="1.5"/><circle cx="240" cy="340" r="1.5"/><circle cx="300" cy="340" r="1.5"/>
    <circle cx="900" cy="340" r="1.5"/><circle cx="960" cy="340" r="1.5"/><circle cx="1020" cy="340" r="1.5"/><circle cx="1080" cy="340" r="1.5"/><circle cx="1140" cy="340" r="1.5"/>
  </g>
  <!-- RW Logo Mark -->
  <g transform="translate(80, 100)" filter="url(#glow)">
    <path d="M 15 180 V 25 H 70 A 28 28 0 0 1 70 105 H 15 M 42 105 L 85 180" fill="none" stroke="#0ea5e9" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 110 25 L 128 180 L 160 100 L 192 180 L 210 25" fill="none" stroke="#0ea5e9" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="15" cy="25" r="6" fill="#0f172a"/>
    <circle cx="70" cy="65" r="6" fill="#0f172a"/>
    <circle cx="85" cy="180" r="6" fill="#0f172a"/>
    <circle cx="110" cy="25" r="6" fill="#0f172a"/>
    <circle cx="160" cy="100" r="6" fill="#0f172a"/>
    <circle cx="210" cy="25" r="6" fill="#0f172a"/>
  </g>
  <!-- Title -->
  <text x="380" y="175" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="56" font-weight="800" fill="#0f172a">RealWorld<tspan fill="#0ea5e9">Claw</tspan></text>
  <!-- Tagline -->
  <text x="380" y="220" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="18" fill="#475569" letter-spacing="0.1em">THE OPEN MANUFACTURING NETWORK</text>
  <!-- Subtitle -->
  <text x="380" y="265" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="16" fill="#64748b">Connect distributed manufacturing capacity. 3D printers, CNC, laser — on demand.</text>
  <!-- Accent line -->
  <rect x="380" y="235" width="60" height="3" rx="1.5" fill="url(#accent)"/>
</svg>
