[project]
name = "realworldclaw"
version = "0.1.0"
description = "RealWorldClaw — Distributed manufacturing network"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.135.1",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "aiohttp>=3.13.3",
    "structlog>=24.1.0",
    "bcrypt>=5.0.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.22",
    "pyyaml>=6.0.3",
    "jsonschema>=4.20.0",
    "psutil>=5.9.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "redis[hiredis]>=5.0.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
]

[project.scripts]
rwc = "cli.rwc:main"

[tool.setuptools.packages.find]
include = ["api*", "cli*", "skills*", "printer*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py310"
line-length = 120
