name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies and run tests
        env:
          JWT_SECRET_KEY: ci-test
          RWC_API_KEY_SECRET: test-ci-api-key-secret
        run: |
          cd platform
          pip install -r requirements.txt
          pip install pytest-cov
          pytest tests/ -x -q --cov=api --cov-report=term-missing --cov-report=xml:coverage.xml

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install and build
        run: |
          cd frontend
          npm ci
          npm run build

  frontend-lint:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install
        run: cd frontend && npm ci
      - name: Lint
        run: cd frontend && npm run lint
      - name: Type Check
        run: cd frontend && npx tsc --noEmit

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install
        run: cd frontend && npm ci
      - name: Test
        run: cd frontend && npm test

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install and lint
        run: |
          cd platform
          pip install -r requirements.txt
          pip install ruff
          ruff check .

  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: No mock data check
        run: |
          if grep -rn "mock\|MOCK\|fake\|dummy" frontend/app/ --include="*.tsx" --include="*.ts" | grep -v "node_modules" | grep -v ".test." | grep -v "__mock__"; then
            echo "❌ Found mock/fake data in frontend app code"
            exit 1
          fi
          echo "✅ No mock data found"
      - name: No alert() check
        run: |
          if grep -rn "alert(" frontend/app/ --include="*.tsx" --include="*.ts" | grep -v "node_modules"; then
            echo "❌ Found alert() in frontend"
            exit 1
          fi
          echo "✅ No alert() found"
      - name: Dependency audit
        run: |
          cd frontend && npm audit --audit-level=high || true
