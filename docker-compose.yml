version: "3.9"
services:
  backend:
    build:
      context: ./platform
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./platform/.env
    volumes:
      - ./platform:/app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
